name: Daily Streetscene Scraper

on:
  schedule:
    - cron: '0 2 * * *'  # Runs automatically at 02:00 AM UTC every day
  workflow_dispatch:      # Allows you to trigger it manually via a button

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper Script
        run: python update_streetscene.py

      - name: Save changes back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projects.json
          git commit -m "Auto-update Streetscene data" || exit 0
          git push
